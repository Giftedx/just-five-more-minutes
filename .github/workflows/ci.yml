name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A superseded run wastes a runner without this: the conveyor force-pushes
# its branches, and each push queued a fresh complete run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
